spring.application.name=config-server
server.port=8888

# --- Config source ---
# In the monorepo, configuration lives in /config-repo at the project root.
# By default we serve it directly from the filesystem (native backend) so the
# bundled config is the single source of truth and edits are picked up locally.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:../../config-repo

# Original Git backend (kept for remote/cloud deployments where config-repo is
# published to its own repository). Activate by setting profile "git".
spring.cloud.config.server.git.uri=https://github.com/Yazzine02/voyage-config-repo
spring.cloud.config.server.git.clone-on-start=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
