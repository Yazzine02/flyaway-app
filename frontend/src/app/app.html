<div class="flex min-h-screen flex-col">
  <mat-toolbar class="!sticky top-0 z-50 !bg-white/90 shadow-sm backdrop-blur">
    <a routerLink="/" class="flex items-center gap-2 no-underline">
      <mat-icon class="text-sky-600">flight_takeoff</mat-icon>
      <span class="text-xl font-bold tracking-tight text-slate-800">Fly<span class="text-sky-600">Away</span></span>
    </a>

    <nav class="ml-8 hidden items-center gap-1 md:flex">
      <a mat-button routerLink="/" routerLinkActive="text-sky-600" [routerLinkActiveOptions]="{ exact: true }">Flights</a>
      <a mat-button routerLink="/" routerLinkActive="text-sky-600">Hotels</a>
      <a mat-button routerLink="/" routerLinkActive="text-sky-600">Deals</a>
    </nav>

    <span class="flex-1"></span>

    <a mat-button class="!hidden sm:!inline-block">Sign in</a>
    <a mat-flat-button color="primary" class="!ml-2">Register</a>
  </mat-toolbar>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 bg-slate-50 py-8 text-sm text-slate-500">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-3 px-4 sm:flex-row">
      <span>© 2026 FlyAway. Built for the journey.</span>
      <div class="flex gap-4">
        <a class="hover:text-sky-600" routerLink="/">About</a>
        <a class="hover:text-sky-600" routerLink="/">Support</a>
        <a class="hover:text-sky-600" routerLink="/">Privacy</a>
      </div>
    </div>
  </footer>
</div>
